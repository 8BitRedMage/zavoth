server {
  listen 8080;
  root /usr/share/nginx/html;

  # Prerendered routes (e.g. `/`, `/pricing`) are served as static HTML;
  # every other route falls back to Wasp's SPA entry, 200.html.
  location / {
    try_files $uri $uri/index.html $uri.html /200.html;
  }

  # Vite emits content-hashed filenames here.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
